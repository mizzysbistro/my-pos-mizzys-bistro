<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Mizzy's Bistro point-of-sale app. Local-first POS with offline support.">
<title>My POS · Mizzy's Bistro</title>

<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#12302f;--mute:#5d7471;--line:#dbe4e1;--pri:#1f6f5c;--prit:#fff;--acc:#e8a317;--bad:#c8433a;--soft:#e4f0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--card:#162826;--ink:#e6f0ed;--mute:#93aca7;--line:#27403c;--pri:#3fb391;--prit:#06231c;--acc:#f0b84a;--bad:#ef7a70;--soft:#1d3a35}}
:root[data-theme="dark"]{--bg:#0e1b1a;--card:#162826;--ink:#e6f0ed;--mute:#93aca7;--line:#27403c;--pri:#3fb391;--prit:#06231c;--acc:#f0b84a;--bad:#ef7a70;--soft:#1d3a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.p{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}
button.d{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--pri);color:var(--prit);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:20px;margin-right:6px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{background:transparent;color:inherit;border-color:transparent;white-space:nowrap}
nav button.on{background:var(--prit);color:var(--pri);font-weight:700}
.who{font-size:13px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#7ee08a;display:inline-block}.dot.off{background:var(--acc)}
main{padding:12px;max-width:1300px;margin:auto}
.pos{display:grid;grid-template-columns:1fr 370px;gap:12px}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 10px;border-radius:999px;font-size:13px}
.chip.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.chip.busy{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.tile{text-align:left;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tile b{font-size:14px}.tile .e{font-size:26px}.tile small{color:var(--mute)}
.tile.out{opacity:.4}
.line{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.line small{color:var(--mute);display:block}
.q{display:flex;gap:4px;align-items:center}.q button{padding:2px 9px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .g{font:800 22px "Bricolage Grotesque",sans-serif;border-top:2px solid var(--ink);margin-top:6px;padding-top:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
#modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.box h2{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kpi{font:800 26px "Bricolage Grotesque",sans-serif}
.bar{height:10px;border-radius:5px;background:var(--pri);margin:3px 0 8px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft)}
.tag.w{background:color-mix(in srgb,var(--acc) 30%,var(--card))}.tag.b{background:color-mix(in srgb,var(--bad) 25%,var(--card))}
.mut{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;display:none;z-index:30}
@media(prefers-reduced-motion:no-preference){.box{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
@media print{.box .mut,.box small{color:#000!important}body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important;padding:0}.box{box-shadow:none;max-width:80mm;margin:0;padding:0;max-height:none;overflow:visible;color:#000;background:#fff}.noprint{display:none!important}}

.qrb svg{width:100%;height:auto;display:block}.qrb{background:#fff;padding:6px;border-radius:8px}
.who{margin-left:auto}
main{padding-bottom:96px}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:19;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:60px;font-size:12px;position:relative;color:var(--mute)}
.bn button span{font-size:22px;line-height:1.1}
.bn button.on{color:var(--pri);background:var(--soft);font-weight:700}
.bd{position:absolute;top:6px;right:22%;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
#sb{position:fixed;inset:0;z-index:17;background:rgba(0,0,0,.4);display:none}
#sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:18;background:var(--card);border-radius:16px 16px 0 0;border:1px solid var(--line);max-height:72vh;overflow:auto;padding:14px;display:none;max-width:640px;margin:auto}
#sheet h3{font-size:14px;color:var(--mute);margin:12px 0 6px}#sheet h3:first-child{margin-top:0}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sg button{display:flex;gap:8px;align-items:center;text-align:left;padding:12px;position:relative}
.sg button.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.sg .bd{position:static;margin-left:auto}
@media(max-width:600px){.hs{display:none}header h1{font-size:18px}.who{gap:6px;font-size:12px}}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:16;background:var(--pri);color:var(--prit);border:0;border-radius:99px;padding:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media(min-width:901px){.cartbar{display:none}}
@media(max-width:900px){#toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}}
.br{opacity:.85;font-size:13px;margin-right:6px}@media(max-width:700px){.br{display:none}}
.crit{background:color-mix(in srgb,var(--bad) 14%,var(--card))!important;border-color:color-mix(in srgb,var(--bad) 55%,var(--line))!important}
.tile.crit small{color:var(--bad);font-weight:600}
.mi{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;flex-wrap:wrap}.mi .n{flex:1;min-width:180px}.mi.hid{opacity:.6}
tr.critr td{background:color-mix(in srgb,var(--bad) 12%,var(--card))}

/* PIN pad */
.pinw{text-align:center;max-width:300px;margin:0 auto;padding:4px 0}
.pinlock{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:26px}
.pinmsg{min-height:20px;margin:6px 0 14px;font-size:14px;color:var(--mute)}.pinmsg.bad{color:var(--bad);font-weight:600}
.pds{display:flex;justify-content:center;gap:16px;margin:0 0 20px}
.pd{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri);transition:background .12s}
.pd.f{background:var(--pri);}
.pds.shake .pd{background:var(--bad);border-color:var(--bad)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.pkey{width:72px;height:72px;border-radius:50%;font-size:26px;font-weight:600;padding:0;background:var(--card);border:1px solid var(--line);transition:transform .08s,background .1s}
.pkey:active:not(:disabled){transform:scale(.92);background:var(--soft)}
.pkey.s{font-size:19px;color:var(--mute);background:transparent;border-color:transparent}
.pin-in{text-align:center;font-size:22px;letter-spacing:10px}
.pin-management{animation:none!important;transition:none!important;contain:layout paint;}
.pin-management *{animation:none!important;}
/* Stable PIN pad + kitchen timers */
.pinw-stable .box{animation:none!important;transform:none!important;opacity:1!important}
.kitchen-clock{font-variant-numeric:tabular-nums;font-weight:700}
.timer-done{animation:none!important;border-color:var(--bad)!important}


/* Menu tiles */
.tile{position:relative;transition:transform .08s,box-shadow .15s,border-color .15s,background .15s}
.tile:hover:not(.out){border-color:var(--pri);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tile:active:not(.out){transform:scale(.96);background:var(--soft)}
.tile .cnt{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--pri);color:var(--prit);font-size:12px;font-weight:700;display:grid;place-items:center}
@media(prefers-reduced-motion:no-preference){.tile.pop{animation:pop .4s ease-out}@keyframes pop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pri) 55%,transparent);background:var(--soft)}100%{box-shadow:0 0 0 14px transparent}}}
/* Options modal */
.mh{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.mh .me{font-size:38px;width:62px;height:62px;border-radius:16px;background:var(--soft);display:grid;place-items:center;flex:none}
.mg{margin-top:14px}
.mgt{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:6px}
.mgh{font-weight:400;font-size:12px;color:var(--mute)}
.mo{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mopt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:center;transition:transform .08s,border-color .12s,background .12s}
.mopt small{color:var(--mute);font-size:12px}
.mopt:active{transform:scale(.97)}
.mopt.on{border-color:var(--pri);background:var(--soft);font-weight:700}
.mopt.on::after{content:'✓';position:absolute;top:3px;right:8px;color:var(--pri);font-size:13px}
.mgo{width:100%;margin-top:16px;padding:14px;font-size:16px;border-radius:12px}
/* Notes */
.tnote{background:color-mix(in srgb,var(--acc) 22%,var(--card));border-radius:8px;padding:6px 10px;margin:8px 0;font-size:14px}
.line small.ln{color:var(--ink);font-style:italic}
.bd.w{background:var(--acc);color:#000}

/* Enhanced calculator, subtle POS motion, and timer controls */
.calcw{max-width:390px;margin:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 45px rgba(18,48,47,.16)}
.calcw-stable{animation:none!important;transform:none!important}
.calc-title{margin:2px 2px 8px;font-size:24px;color:var(--ink)}
.calc-screen{min-height:122px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 6px 14px;overflow:hidden;background:var(--bg);border-radius:14px;margin-bottom:12px}.calc-expression{font-size:20px;color:var(--mute);min-height:30px;white-space:nowrap}.calc-answer{font-size:52px;line-height:1.05;color:var(--ink);font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.calcgrid button{height:64px;font-size:25px;font-weight:650;border-radius:11px;border:1px solid var(--line);background:var(--soft);color:var(--ink);transition:transform .08s,filter .12s,background .12s}.calcgrid button:active{transform:scale(.95);filter:brightness(1.08)}.calcgrid .op{background:var(--pri);color:var(--prit);border-color:var(--pri);font-size:28px}.calcgrid .func{background:var(--line);color:var(--ink)}.calcgrid .eq{background:var(--acc);color:#000;border-color:var(--acc);height:64px}.calcclose{width:100%;margin-top:12px;background:var(--bg);color:var(--ink);border-color:var(--line)}.pinw-stable{animation:none!important}.timer-controls{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;padding:2px 5px;background:var(--card)}.timer-controls button{padding:2px 9px;min-width:30px}.timer-controls b{min-width:48px;text-align:center;font-size:12px}
@media(max-width:500px){.calcw{max-width:350px;padding:14px}.calcgrid{gap:8px}.calcgrid button{height:58px}.calc-answer{font-size:46px}}
@media(prefers-reduced-motion:no-preference){.card{animation:cardIn .16s ease-out both}.bn button{transition:transform .1s,background .15s}.bn button:active{transform:translateY(2px)}@keyframes cardIn{from{opacity:.82;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* Mobile/tablet polish: comfortable touch targets, safe-area spacing, and stable dialogs. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{min-width:320px;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{touch-action:manipulation}
button{min-height:40px}
input,select,textarea{min-height:42px}
#modal{padding: max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.box{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overscroll-behavior:contain}
.card,.mi,.line{min-width:0}
@media(max-width:600px){
  main{padding:8px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  header{gap:6px;padding:8px 10px}
  header h1{font-size:17px}
  .who{gap:5px}
  .who button{min-height:38px;padding:5px 8px!important}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .tile{min-height:108px;padding:10px 8px;overflow-wrap:anywhere}
  .tile b{font-size:14px;line-height:1.25}
  .pos{grid-template-columns:minmax(0,1fr);gap:8px}
  .pos>section,.pos>aside{min-width:0}
  .card{padding:10px;border-radius:10px}
  .row{gap:6px}
  .row>*{max-width:100%}
  .q button{min-width:36px;min-height:36px}
  .bn button{min-height:58px;padding:6px 2px}
  .cartbar{left:8px;right:8px;padding:13px;bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  table{display:block;overflow-x:auto;max-width:100%;white-space:normal}
  .mi .n{min-width:140px}
  .pk{gap:8px}
  .pkey{width:min(72px,20vw);height:min(72px,20vw);min-height:56px}
}
@media(max-width:360px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .e{font-size:23px}
  .bn button{font-size:10px}
  .who{margin-left:0}
}
@media(hover:none){.tile:hover:not(.out){box-shadow:none;border-color:var(--line)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* Final UI polish: clearer hierarchy, touch comfort, and compact-screen resilience. */
:root{--radius-card:14px;--shadow-card:0 2px 8px rgba(18,48,47,.045);--shadow-float:0 8px 24px rgba(18,48,47,.16)}
body{line-height:1.45}
h1{letter-spacing:-.025em}h2{font-size:clamp(1.12rem,2vw,1.35rem);line-height:1.25;letter-spacing:-.015em}h3{font-size:1rem;line-height:1.3}
.card{border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
button{transition:background-color .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease}
button:not(:disabled):focus-visible{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
button.p:not(:disabled):hover{filter:brightness(1.04)}
button.d:not(:disabled):hover{background:color-mix(in srgb,var(--bad) 9%,var(--card))}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--pri)}
label{display:block;line-height:1.35}
header{box-shadow:0 2px 10px rgba(0,0,0,.08)}
header h1{letter-spacing:-.03em}
nav{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grid{align-items:stretch}
.tile{border-radius:13px;border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.025)}
.tile .e{line-height:1.25}
.tile small{line-height:1.3}
.line{gap:10px}
.q button{min-width:40px;min-height:40px}
.tag{line-height:1.5;white-space:normal;overflow-wrap:anywhere}
#modal{backdrop-filter:blur(3px)}
.box{box-shadow:var(--shadow-float);border:1px solid var(--line)}
#sheet{box-shadow:0 -8px 28px rgba(0,0,0,.12)}
.bn{box-shadow:0 -2px 10px rgba(0,0,0,.045);padding-top:3px}
.bn button{min-width:0;overflow-wrap:anywhere}
.bn button.on{box-shadow:inset 0 3px 0 var(--pri)}
.cartbar{box-shadow:0 6px 22px rgba(0,0,0,.22);min-height:48px}
#toast{max-width:min(92vw,560px);text-align:center;line-height:1.35;box-shadow:0 4px 18px rgba(0,0,0,.2)}
table th{font-size:.9rem;color:var(--mute);font-weight:700}
table td,table th{padding:10px 8px;vertical-align:middle}
.kpi{letter-spacing:-.035em;overflow-wrap:anywhere}
:focus{scroll-margin-block:100px}
@media(min-width:901px){
  main{padding:18px 20px 110px}
  .card{padding:16px}
  .pos{grid-template-columns:minmax(0,1fr) minmax(330px,370px);gap:16px}
  .grid{gap:10px}
  .tile{min-height:110px;padding:12px}
}
@media(min-width:601px) and (max-width:900px){
  main{padding:12px 14px 108px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
  .cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
}
@media(max-width:600px){
  body{font-size:15px}
  /* Prevent mobile browsers from zooming the page when a field receives focus. */
  input,select,textarea{font-size:16px;min-height:44px;padding:10px}
  button{min-height:44px}
  header{box-shadow:0 2px 8px rgba(0,0,0,.09)}
  .who button{min-height:40px}
  .card{box-shadow:0 1px 5px rgba(18,48,47,.04)}
  .tile{min-height:112px;gap:4px}
  .tile .e{font-size:25px}
  .q button{min-width:40px;min-height:40px}
  .box{padding:14px;border-radius:16px}
  .bn button{min-height:62px;line-height:1.15}
  .bn button span{font-size:21px}
  .sg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sg button{min-height:48px}
  #sheet{max-height:calc(76dvh - env(safe-area-inset-bottom,0px));padding:14px 12px}
  #toast{width:max-content;max-width:calc(100vw - 24px)}
  .cartbar{font-size:15px}
}
@media(max-width:360px){
  main{padding-left:6px;padding-right:6px}
  .card{padding:9px}
  .tile{padding:8px 7px;min-height:104px}
  .bn button{font-size:9px}
  .bn button span{font-size:19px}
  .box{padding:12px}
}
@media(orientation:landscape) and (max-height:500px){
  header{position:relative}
  #modal{align-items:flex-start;overflow:auto}
  .box{max-height:none;margin:auto}
  #sheet{max-height:55vh}
  .pinw{padding-bottom:8px}
  .pkey{width:56px;height:56px;min-height:56px}
  .pds{margin-bottom:10px}
}
@media(prefers-reduced-motion:reduce){button{transition:none!important}}

</style>
</head>
<body>

function cashierTicketTable(options={}){

function sharedOrderHistory(){return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Order history</h2><span class="tag">${orders.length} sale${orders.length===1?'':'s'}</span></div><p class="mut">This is the shared paid-order ledger. The Cashier and Orders views both read the same saved sales records.</p>${orders.length?`<table><thead><tr><th>OR no.</th><th>Ticket</th><th>Total</th><th>Paid</th><th>By</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td>${fmtOR(o.orNo)}<br><small class="mut">#${o.id}</small></td><td>${esc(o.k)}${o.or?' <span class="tag">Buyer</span>':''}${(o.c.spl||[]).length?' <span class="tag w">SC/PWD</span>':''}${o.note?'<br><small class="mut">📝 '+esc(o.note)+'</small>':''}</td><td>${m$(o.c.tot)}</td><td>${(o.pay||[]).map(p=>esc(p.m)).join('+')||'—'}</td><td>${esc(o.staff||'—')}</td><td>${o.ref?`<span class="tag b" title="${esc(o.refWhy||'')}">Refunded</span>`:`<button onclick="receipt(orders.find(x=>x.id===${o.id}),1)">View</button> <button class="d" onclick="refund(${o.id})">Refund</button>`}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No paid sales yet. Complete a payment in the Register or Cashier view and it will appear here.</p>'}</div>`}
function printBill(k){
const t=tickets[k];
if(!t||!Array.isArray(t.lines)||!t.lines.length)return toast('This ticket is no longer open. Refresh the list and try again.');
const billLines=t.pending?t.lines:t.lines.filter(l=>l&&l.sent);

const bill={...t,lines:billLines},c=calc(bill);
modal(`${hdr()}<h3 style="text-align:center;letter-spacing:1px;margin-top:8px">BILL — NOT AN OFFICIAL RECEIPT</h3><p class="mut" style="text-align:center">${esc(tl(t.k))} · ${new Date().toLocaleString()}</p>${bill.lines.map(l=>`<div class="line"><span class="n">${Number(l.q)||0} × ${esc(l.n)}${l.mod?`<small>${esc(l.mod)}</small>`:''}${l.note?`<small>Note: ${esc(l.note)}</small>`:''}</span>${m$(Math.max(0,Number(l.p)||0)*(Number(l.q)||0))}</div>`).join('')}<div class="tot" style="margin-top:8px">${totRows(c,1)}</div>${vatBox(c)}${bill.note?`<p class="mut">Request: ${esc(bill.note)}</p>`:''}<p class="mut" style="text-align:center">Unpaid bill only. This is not an official receipt. The final receipt is issued after payment.</p><div class="row noprint"><button class="p" onclick="window.print()">Print bill</button><button onclick="closeModal()">Close</button></div>`);
}

function vOrders(){const sv=servedList(),wait=sv.length?`<div class="card" style="margin-bottom:10px;border-color:var(--acc)"><div class="row" style="justify-content:space-between"><h2>Served, not yet paid</h2><span class="tag w">${sv.length}</span></div><p class="mut">Every item on these orders has been served. They stay here until you charge them.</p>${sv.map(t=>{const c=calc(t),n=t.lines.reduce((a,l)=>a+l.q,0),at=servedAt(t);return `<div class="line"><span class="n"><b>${esc(tl(t.k))}</b> <span class="tag w">Served</span><small>${n} item${n>1?'s':''}${at?' · served '+at:''} · ${m$(c.due)}${t.note?' · 📝 '+esc(t.note):''}</small></span><button onclick="openT('${t.k}')">Open</button><button class="p" onclick="chargeServed('${t.k}')">Charge</button></div>`}).join('')}</div>`:'';return wait+cashierTicketTable({hideServed:true,title:'Open cashier orders'})+sharedOrderHistory()}

function reorder(){return menu.filter(crit).map(i=>({...i,need:Math.max(1,25-i.s)}))}

function todayOrders(){const n=new Date(),start=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),end=start+86400000;return orders.filter(o=>{const t=new Date(o.at).getTime();return Number.isFinite(t)&&t>=start&&t<end})}
function vDash(){const ok=todayOrders().filter(o=>!o.ref),rev=ok.reduce((a,o)=>a+o.c.tot,0),cnt={},pm={},st={};
ok.forEach(o=>{o.lines.forEach(l=>cnt[l.n]=(cnt[l.n]||0)+l.q);o.pay.forEach(p=>pm[p.m]=(pm[p.m]||0)+p.a);if(o.chg)pm.Cash=(pm.Cash||0)-o.chg;st[o.staff]=(st[o.staff]||0)+o.c.tot});

<div class="cols" style="margin-top:10px"><div class="card"><h3>Best sellers</h3>${top.map(t=>`<div>${t[0]} · ${t[1]}</div><div class="bar" style="width:${t[1]/mx*100}%"></div>`).join('')||'<p class="mut">Sell something to see rankings.</p>'}</div>
<div class="card"><h3>Payment mix</h3>${Object.entries(pm).map(p=>`<div class="line"><span class="n">${p[0]}</span>${m$(p[1])}</div>`).join('')||'<p class="mut">No payments yet.</p>'}<h3 style="margin-top:12px">Staff sales and 3% commission</h3>${Object.entries(st).map(p=>`<div class="line"><span class="n">${p[0]} · ${m$(p[1])}</span>${m$(p[1]*.03)}</div>`).join('')||'<p class="mut">No sales yet.</p>'}</div>
<div class="card"><h3>Low stock alerts</h3>${low.map(i=>`<div class="line"><span class="n">${i.e} ${i.n}</span><span class="tag ${i.s<=0?'b':'w'}">${i.s} left</span></div>`).join('')||'<p class="mut">All items are well stocked.</p>'}</div></div>`}
function reportModal(){const day=todayOrders(),ok=day.filter(o=>!o.ref),sum=f=>r2(ok.reduce((a,o)=>a+f(o.c),0)),pm={},cnt={},st={};
ok.forEach(o=>{o.lines.forEach(l=>cnt[l.n]=(cnt[l.n]||0)+l.q);o.pay.forEach(p=>pm[p.m]=(pm[p.m]||0)+p.a);if(o.chg)pm.Cash=(pm.Cash||0)-o.chg;st[o.staff]=(st[o.staff]||0)+o.c.tot});

const units=t=>{const u=[];t.lines.forEach((l,li)=>{for(let k=0;k<l.q;k++)u.push({li,seat:l.seat||1})});return u};
const guestOpts=(n,sel)=>[...Array(n)].map((_,g)=>`<option value="${g+1}" ${sel===g+1?'selected':''}>Guest ${g+1}</option>`).join('');function splitModal(){const t=tickets[cur];if(!t||!t.lines.length)return toast('Add items before splitting.');SPL={mode:(t.ns||1)>1?'seat':'item',n:2,asg:[],hg:{}};paintSplit()}

const tabs=[['seat','By seat'],['item','By item'],['even','Evenly']].map(x=>`<button class="chip ${S.mode===x[0]?'on':''}" onclick="SPL.mode='${x[0]}';paintSplit()">${x[1]}</button>`).join('');

else if(S.mode==='item'){body=`${counter(2,6)}${(t.sp||[]).map((h,hi)=>`<div class="line"><span class="n">${h.type==='SC'?'Senior':'PWD'} · ${esc(h.name)}<small>Discount goes on this guest's bill</small></span><select style="width:auto" onchange="SPL.hg[${hi}]=+this.value">${guestOpts(S.n,S.hg[hi]||1)}</select></div>`).join('')}${u.map((x,i)=>{const l=t.lines[x.li];return `<div class="line"><span class="n">${l.n}<small>${l.mod||''} ${m$(l.p)}</small></span><select style="width:auto" onchange="SPL.asg[${i}]=+this.value;splTot()">${guestOpts(S.n,S.asg[i]||1)}</select></div>`}).join('')}<div id="sptot" class="tot" style="margin-top:8px"></div><button class="p" style="margin-top:10px" onclick="doSplit()">Create bills</button>`}
else{body=`${counter(2,8)}<p>Total <b>${m$(c.due)}</b> · about <b>${m$(c.due/S.n)}</b> each</p><p class="mut">One official receipt for the whole bill. Each guest pays in turn and can use a different method.</p><button class="p" onclick="doSplit()">Start split payment</button>`}
modal(`<h2>Split bill · ${esc(t.k)}</h2><div class="row" style="margin-bottom:8px">${tabs}</div>${body}<div class="row" style="margin-top:12px"><button onclick="closeModal()">Cancel</button></div>`);if(S.mode==='item')splTot()}

function doSplit(){const t=tickets[cur],S=SPL,u=units(t);if(S.mode==='even'){const n=S.n;SPL=null;closeModal();pendSplit=n;return checkout()}

const made=ids.map((id,bi)=>{const m={};u.forEach((x,i)=>{if(g[i]===id)m[x.li]=(m[x.li]||0)+1});
const ch={k:t.k+' · '+(S.mode==='seat'?'Seat ':'Guest ')+id,type:t.type,lines:Object.keys(m).map(li=>({...t.lines[li],q:m[li],seat:1})),staff:t.staff,parent:t.parent||t.k,seat:1,ns:1};
ch.sp=(t.sp||[]).filter((h,hi)=>S.mode==='seat'?(h.seat===id||(h.seat===0&&bi===0)):(S.hg[hi]||1)===id).slice(0,1).map(h=>({...h,seat:0}));
if(bi===0){if(t.cust)ch.cust=t.cust;if(t.rp)ch.rp=t.rp;if(t.cr)ch.cr=t.cr}
if(t.d&&(t.d.t==='%'||bi===0))ch.d={...t.d};if(t.zr)ch.zr=t.zr;if(t.note)ch.note=t.note;return ch});
delete tickets[t.k];made.forEach(x=>tickets[x.k]=x);cur=made[0].k;SPL=null;log('other','Bill split',t.k+' into '+made.length+' bills ('+S.mode+')',0);closeModal();render();toast('Split into '+made.length+' bills.')}

<div class="row" style="margin-top:14px"><button class="p" onclick="saveItem(${id})">${id?'Save changes':'Add item'}</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveItem(id){const n=String($('#f_n').value).replace(/[<>&`]/g,'').trim(),e=clean($('#f_e').value)||'🍽️',p=r2(+$('#f_p').value),s=Math.floor(+$('#f_s').value),g=Math.floor(+$('#f_g').value),o=$('#f_o').value,barcode=String($('#f_barcode')?.value||'').trim().slice(0,100);let c=$('#f_c').value;
if(c==='__new'){c=clean($('#f_nc').value);if(!c)return toast('Enter the new category name.')}
if(!n)return toast('Enter an item name.');if(!(p>0))return toast('Enter a price above zero.');if(!(s>=0)||!(g>=0))return toast('Stock numbers cannot be negative.');
if(menu.some(x=>x.id!==id&&x.n.toLowerCase()===n.toLowerCase()))return toast('An item with that name already exists.');
if(!catList.includes(c))catList.push(c);
if(id){const it=menu.find(x=>x.id===id),pc=it.p!==p,old=it.p;Object.assign(it,{n,e,c,p,s,par:g,o,barcode});if(pc)log('price','Price change',n+' '+m$(old)+' to '+m$(p)+' (item edited)',p-old);else log('other','Item edited',n,0)}
else{menu.push({id:Math.max(0,...menu.map(x=>x.id))+1,n,e,c,p,s,par:g,o,barcode});log('other','Item added',n+' · '+m$(p)+' · '+c,0)}
closeModal();render();toast(id?'Saved.':'Item added.')}
function catModal(){modal(`<h2>Categories</h2><p class="mut">Rename a category or add one. A category can be removed once it has no items.</p>${catList.map((c,i)=>{const n=menu.filter(x=>x.c===c).length;return `<div class="row" style="margin:6px 0;flex-wrap:nowrap"><input id="cr${i}" value="${esc(c)}" maxlength="20"><button onclick="renCat(${i})">Rename</button><button class="d" ${n?'disabled title="Has items"':''} onclick="delCat(${i})">Remove</button></div>`}).join('')}<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="cnew" placeholder="New category" maxlength="20"><button class="p" onclick="addCat()">Add</button></div><div style="margin-top:12px"><button onclick="closeModal();render()">Done</button></div>`)}
function renCat(i){const v=clean($('#cr'+i).value);if(!v)return toast('Enter a name.');if(catList.some((x,j)=>j!==i&&x.toLowerCase()===v.toLowerCase()))return toast('That category already exists.');const old=catList[i];if(v===old)return;menu.forEach(x=>{if(x.c===old)x.c=v});catList[i]=v;if(cat===old)cat=v;if(mc===old)mc=v;log('other','Category renamed',old+' to '+v,0);catModal()}
function delCat(i){const old=catList[i];if(menu.some(x=>x.c===old))return toast('Move or hide its items first.');if(catList.length<=1)return toast('Keep at least one category.');catList.splice(i,1);if(cat===old)cat='All';if(mc===old)mc='All';log('other','Category removed',old,0);catModal()}
function addCat(){const v=clean($('#cnew').value);if(!v)return toast('Enter a name.');if(catList.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('That category already exists.');catList.push(v);log('other','Category added',v,0);catModal()}

return `<div class="card" style="max-width:560px"><h2>Receipt and BIR details</h2><p class="mut">These print on every official receipt and shift report. Copy them from your BIR registration, permit to use and authority to print.</p>${f('tin','TIN (VAT registered)','000-000-000-00000')}${f('reg','Registered name (optional)','Registered business name')}${f('min','Machine ID no. (MIN)','')}${f('sn','POS serial no.','')}${f('ptu','Permit to use (PTU) no.','')}${f('atp','Authority to print (ATP) no.','')}
<div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label style="${fl}">OR series from</label><input id="cf_serFrom" type="number" min="1" value="${cfg.serFrom}"></div><div style="flex:1"><label style="${fl}">OR series to</label><input id="cf_serTo" type="number" min="0" value="${cfg.serTo||''}"></div></div>
${f('sup','POS supplier line (name, TIN, accreditation no.)','Prints at the bottom of receipts')}
<p class="mut">Next OR number: <b>${fmtOR(orSeq+1)}</b>${cfg.serTo?' · '+left+' left in this series':''}</p><button class="p" onclick="mgr(saveCfg)">Save details</button></div>
<div class="card" style="max-width:560px;margin-top:10px"><h3>How the tax lines work</h3><p class="mut">Menu prices include 12% VAT. A Senior or PWD discount removes the VAT first, then takes 20% off, and that sale prints under VAT-exempt. Zero-rated sales need an admin PIN. The OR number goes up by one on every sale, and checkout stops when the series runs out.</p></div>${cloudCard()}${pinCard()}<div class="card" style="max-width:560px;margin-top:10px"><h2>Local backup and restore</h2><p class="mut">Backups stay on this device until you save or share the file yourself. Make a backup at the end of each shift and before editing menu, tax, or receipt settings.</p><div class="row"><button class="p" onclick="exportBackup()">Download backup</button><button onclick="document.getElementById('backupFile').click()">Restore backup</button><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></div><p class="mut" style="margin-top:8px;font-size:13px">Restoring replaces the current menu, orders, stock, shifts and settings. The app first saves a safety copy of current data in this browser. Keep backup files private because they may contain sales and customer details.</p><div id="backupStatus" class="mut" role="status"></div><div class="row" style="margin-top:8px"><button onclick="checkStorageStatus()">Check device storage</button></div><div id="storageStatus" class="mut" role="status" style="margin-top:6px">Storage details are available when supported by this browser.</div></div>`}
function saveCfg(){const g=k=>($('#cf_'+k).value||'').trim(),tin=g('tin'),t=tin?fmtTin(tin):'';if(t===null)return toast('TIN needs 9 to 14 digits.');
const from=Math.max(1,Math.floor(+g('serFrom')||1)),to=Math.floor(+g('serTo')||0);if(to&&to<from)return toast('Series end must be after the start.');if(to&&to<orSeq)return toast('Series end is below the last OR already issued.');
const nv={tin:t,reg:g('reg'),min:g('min'),sn:g('sn'),ptu:g('ptu'),atp:g('atp'),serFrom:from,serTo:to,sup:g('sup')},ch=Object.keys(nv).filter(k=>String(nv[k])!==String(cfg[k]));
if(!ch.length)return toast('No changes to save.');cfg=nv;if(orSeq<from-1)orSeq=from-1;log('other','Receipt and BIR details changed',ch.join(', '),0);render();toast('Saved.')}
function backupPayload(){return {app:'Mizzy\'s Bistro POS',format:'mizzy-pos-backup',version:1,createdAt:new Date().toISOString(),data:snap(),pins:Object.fromEntries(staff.map(s=>[s.id,s.pin])),lockMinutes:lockMin}}
function downloadJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

async function checkStorageStatus(){const el=$('#storageStatus');if(!el)return;let localBytes=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'',v=localStorage.getItem(k)||'';localBytes+=(k.length+v.length)*2}}catch(e){el.textContent='This browser blocks local storage access. POS data may not persist reliably.';return}const kb=(localBytes/1024).toFixed(1);try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate(),used=Number.isFinite(e.usage)?(e.usage/1048576).toFixed(2)+' MB':'unknown',quota=Number.isFinite(e.quota)?(e.quota/1048576).toFixed(1)+' MB':'unknown';el.textContent='Estimated browser storage: '+used+' used of '+quota+' available. POS localStorage is about '+kb+' KB. Export backups regularly; browser estimates are approximate.'}else{el.textContent='POS localStorage is about '+kb+' KB. This browser does not report a storage quota. Export backups regularly.'}}catch(e){el.textContent='POS localStorage is about '+kb+' KB. Storage quota details could not be read; export backups regularly.'}}

function exportBackup(){try{const payload=backupPayload(),stamp=new Date().toISOString().replace(/[:.]/g,'-');downloadJson(payload,'mizzy-bistro-pos-backup-'+stamp+'.json');const status=$('#backupStatus');if(status)status.textContent='Backup prepared. Check your Downloads folder and keep a second copy somewhere safe.';toast('Backup file prepared.')}catch(e){toast('Could not create backup: '+(e.message||'unknown error'))}}
function validateBackup(payload){if(!payload||typeof payload!=='object'||Array.isArray(payload))throw new Error('Backup must be a JSON object.');if(payload.format==='mizzy-pos-backup'&&payload.version!==1)throw new Error('This backup version is not supported by this app.');if(payload.format&&payload.format!=='mizzy-pos-backup')throw new Error('This file is not a Mizzy POS backup.');const d=payload.format==='mizzy-pos-backup'?payload.data:payload;if(!d||typeof d!=='object'||!Array.isArray(d.menu)||!Array.isArray(d.orders)||!d.tickets||typeof d.tickets!=='object'||Array.isArray(d.tickets))throw new Error('This file does not look like a valid Mizzy POS backup.');if(!d.menu.every(i=>i&&typeof i==='object'&&Number.isFinite(+i.id)&&typeof i.n==='string'&&Number.isFinite(+i.p)&&Number.isFinite(+i.s)))throw new Error('Backup menu contains an invalid item.');if(!d.orders.every(o=>o&&typeof o==='object'&&Array.isArray(o.lines)&&o.c&&typeof o.c==='object'&&Array.isArray(o.pay)))throw new Error('Backup contains an invalid order.');if(!Object.entries(d.tickets).every(([k,t])=>k&&t&&typeof t==='object'&&Array.isArray(t.lines)))throw new Error('Backup contains an invalid ticket.');if(d.shifts!==undefined&&!Array.isArray(d.shifts))throw new Error('Backup shift history is invalid.');if(d.audit!==undefined&&!Array.isArray(d.audit))throw new Error('Backup audit log is invalid.');return d}
function importBackup(input){const file=input&&input.files&&input.files[0];if(!file)return;if(file.size>25*1024*1024){toast('Backup file is too large (maximum 25 MB).');input.value='';return}const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(String(reader.result||'')),d=validateBackup(payload);if(!confirm('Restore this backup? Current POS data will be replaced. A safety copy of the current data will be saved in this browser first.')){input.value='';return}const current=backupPayload();localStorage.setItem('mizzy3-safety-before-restore',JSON.stringify(current));if(!localStorage.getItem('mizzy3-safety-before-restore'))throw new Error('Could not create a safety copy. Free browser storage and try again.');apply(d);if(payload.pins&&typeof payload.pins==='object')staff.forEach(st=>{const pin=payload.pins[st.id];if(/^\d{4}$/.test(String(pin||'')))st.pin=String(pin)});if(Number.isFinite(+payload.lockMinutes)){lockMin=Math.max(0,+payload.lockMinutes);try{localStorage.setItem('mizzy-lock',String(lockMin))}catch(_){}}savePins();save();render();const status=$('#backupStatus');if(status)status.textContent='Restore complete. Check menu, stock, recent orders and settings before taking payments.';toast('Backup restored. Verify the data before using checkout.')}catch(e){toast('Restore failed: '+(e.message||'invalid backup'));}finally{input.value=''}};reader.onerror=()=>{toast('Could not read that file. Try selecting the backup again.');input.value=''};reader.readAsText(file)}

/* Mobile barcode scanner: camera scanning where BarcodeDetector is supported,
   plus manual/USB-Bluetooth scanner input fallback. */
let scanStream=null, scanRAF=0, scanActive=false;
function scannerStop(){
  scanActive=false;
  if(scanRAF)cancelAnimationFrame(scanRAF);
  scanRAF=0;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
}
function scannerOpen(){
  const body=`<h2>Scan barcode</h2>
  <p class="mut">Use the camera if supported, or enter/scan a barcode with a USB or Bluetooth scanner.</p>
  <div id="scanStatus" class="tag" style="display:block;margin:8px 0">Ready</div>
  <video id="scanVideo" playsinline muted style="width:100%;max-height:34vh;object-fit:cover;background:#111;border-radius:10px;display:none"></video>
  <label for="scanCode">Barcode</label><input id="scanCode" autocomplete="off" inputmode="text" placeholder="Scan or type barcode">
  <div class="row" style="margin-top:10px"><button class="p" onclick="scannerStart()">Start camera</button><button onclick="scannerSubmit()">Find item</button><button onclick="scannerStop();closeModal()">Close</button></div>
  <p class="mut" style="font-size:12px">A menu item must have a matching barcode value to be added automatically. Otherwise the scanned code is shown for manual lookup.</p>`;
  modal(body);
  setTimeout(()=>{const e=$('#scanCode');if(e)e.focus();},80);
}
async function scannerStart(){
  const status=$('#scanStatus'), video=$('#scanVideo');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(status)status.textContent='Camera unavailable in this browser. Use a USB/Bluetooth scanner or type the barcode.';
    return;
  }
  if(typeof BarcodeDetector==='undefined'){
    if(status)status.textContent='Camera barcode detection is not supported here. Use a USB/Bluetooth scanner or type the barcode.';
    return;
  }
  try{
    scannerStop();
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(!video)return;
    video.srcObject=scanStream;video.style.display='block';await video.play();scanActive=true;
    if(status)status.textContent='Camera active — point at a barcode';
    const tick=async()=>{
      if(!scanActive||!video||video.readyState<2)return;
      try{
        const codes=await detector.detect(video);
        if(codes&&codes.length){
          const input=$('#scanCode');if(input)input.value=codes[0].rawValue;
          if(status)status.textContent='Barcode detected: '+codes[0].rawValue;
          scannerStop();return;
        }
      }catch(e){}
      if(scanActive)scanRAF=requestAnimationFrame(tick);
    };
    scanRAF=requestAnimationFrame(tick);
  }catch(e){
    if(status)status.textContent='Could not open camera. Check camera permission, or use a USB/Bluetooth scanner.';
    scannerStop();
  }
}
function scannerSubmit(){
  const input=$('#scanCode'), code=(input?input.value:'').trim();
  if(!code){toast('Scan or enter a barcode first.');return;}
  scannerStop();
  const menuItems=Array.isArray(menu)?menu:[];
  const item=menuItems.find(x=>String(x.barcode||x.bc||x.sku||'').trim()===code);
  if(item){try{add(item,'',0);closeModal();toast('Added '+item.n);}catch(e){toast('Could not add item. Check the menu item setup.');}}
  else{
    const status=$('#scanStatus');
    if(status)status.textContent='Code '+code+' was scanned, but no menu item has that barcode/SKU. Add it to the item setup, then scan again.';
    else toast('No menu item matches that barcode/SKU.');
  }
}
